# Example configuration for the Systemair SAVE VTR300 save_vtr component.
#
# The alarm registers are polled on their own slower interval
# (`alarm_update_interval` on the climate platform) while everything that is
# visible in the UI is polled on `update_interval`. When a summary alarm flag
# changes, the detail registers are rescanned immediately, so a new alarm is
# described within one update cycle.

esphome:
  name: vtr300
  friendly_name: vtr300

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../components  # this repository's components/ directory
    components: [save_vtr]

# Enable logging
logger:

# Enable Home Assistant API
api:
  # encryption:
  #   key: "<generated base64 key>"  # see https://esphome.io/components/api

ota:
  - platform: esphome
    password: "REPLACE_ME"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: mb_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 115200
  stop_bits: 1
  parity: NONE

modbus:
  id: mb1
  uart_id: mb_uart
  # NOTE: command spacing is configured here since ESPHome 2026.10
  # ('command_throttle' on modbus_controller is deprecated):
  turnaround_time: 5ms

modbus_controller:
  - id: save_modbus
    modbus_id: mb1
    address: 5

# Optional; the block itself carries no options and is only needed if you want
# an id for the platform schemas to reference explicitly.
save_vtr:

climate:
  - platform: save_vtr
    name: "SAVE Climate"
    modbus_id: save_modbus
    update_interval: 10s
    # Alarms are polled less frequently than the UI values:
    alarm_update_interval: 300s
    # VTR300 airflow at 100% (m3/h); used for the *_volume sensors
    max_airflow: 300

sensor:
  - platform: save_vtr
    saf_percent:
      name: "Supply Airflow %"
    saf_volume:
      name: "Supply Airflow Volume"
    eaf_percent:
      name: "Extract Airflow %"
    eaf_volume:
      name: "Extract Airflow Volume"
    heat_demand:
      name: "Heat Demand"
    outdoor_air_temp:
      name: "Outdoor Air Temp"
    supply_air_temp:
      name: "Supply Air Temp"
    extract_air_temp:
      name: "Extract Air Temp"
    rpm_saf:
      name: "Supply Air Fan RPM"
    rpm_eaf:
      name: "Extract Air Fan RPM"
    heat_exchanger_utilisation:
      name: "Heat Exchanger Utilisation"
    heater_utilisation:
      name: "Heater Utilisation"
    cooler_utilisation:
      name: "Cooler Utilisation"
    pdm_rhs:
      name: "PDM RHS Sensor"
    # Computed by the component from the three temperatures:
    thermal_efficiency:
      name: "Heat Exchanger Temperature Efficiency"
    alarm_filter_warning_counter:
      name: "Filter Warning Counter"
    active_alarm_count:
      name: "Active Alarm Count"

binary_sensor:
  - platform: save_vtr
    # Summary alarm flags (polled every update_interval):
    alarm_filter_was_detected:
      name: "Alarm Filter Was Detected"
    alarm_output:
      name: "Alarm Output"
    alarm_type_a:
      name: "Alarm Type A"
    alarm_type_b:
      name: "Alarm Type B"
    alarm_type_c:
      name: "Alarm Type C"
    # Correlated backend entities:
    any_alarm_active:
      name: "Any Alarm Active"
    filter_warning_active:
      name: "Filter Warning Active"
    eco_function_active:
      name: "ECO Function Active"
    heater_active:
      name: "Heater Active"
    heat_exchanger_active:
      name: "Heat Exchanger Active"

text_sensor:
  - platform: save_vtr
    user_mode:
      name: "User Mode"
    # Correlated backend entities (change-driven, not republished every poll):
    system_status:
      name: "System Status"
    alarm_summary:
      name: "Alarm Summary"
    # Detail alarm registers (polled on alarm_update_interval):
    alarm_saf_ctrl:
      name: "Alarm SAF Controller"
    alarm_eaf_ctrl:
      name: "Alarm EAF Controller"
    alarm_frost_prot:
      name: "Alarm Frost Protection"
    alarm_defrosting:
      name: "Alarm Defrosting"
    alarm_saf_rpm:
      name: "Alarm SAF RPM"
    alarm_eaf_rpm:
      name: "Alarm EAF RPM"
    alarm_fpt:
      name: "Alarm FPT"
    alarm_oat:
      name: "Alarm OAT"
    alarm_sat:
      name: "Alarm SAT"
    alarm_rat:
      name: "Alarm RAT"
    alarm_eat:
      name: "Alarm EAT"
    alarm_ect:
      name: "Alarm ECT"
    alarm_eft:
      name: "Alarm EFT"
    alarm_oht:
      name: "Alarm OHT"
    alarm_emt:
      name: "Alarm EMT"
    alarm_rgs:
      name: "Alarm RGS"
    alarm_bys:
      name: "Alarm BYS"
    alarm_secondary_air:
      name: "Alarm Secondary Air"
    alarm_filter:
      name: "Alarm Filter"
    alarm_extra_controller:
      name: "Alarm Extra Controller"
    alarm_external_stop:
      name: "Alarm External Stop"
    alarm_rh:
      name: "Alarm RH"
    alarm_co2:
      name: "Alarm CO2"
    alarm_low_sat:
      name: "Alarm Low SAT"
    alarm_byf:
      name: "Alarm BYF"
    alarm_manual_override_outputs:
      name: "Alarm Manual Override Outputs"
    alarm_pdm_rhs:
      name: "Alarm PDM RHS"
    alarm_pdm_eat:
      name: "Alarm PDM EAT"
    alarm_manual_fan_stop:
      name: "Alarm Manual Fan Stop"
    alarm_overheat_temperature:
      name: "Alarm Overheat Temperature"
    alarm_fire:
      name: "Alarm Fire"
    alarm_filter_warning:
      name: "Alarm Filter Warning"

